# Project Information
site_name: OI Wiki tiếng Việt
site_description: OI Wiki tiếng Việt là kho tri thức lập trình thi đấu, cung cấp kiến thức thuật toán, cấu trúc dữ liệu, công cụ và kinh nghiệm học tập hữu ích cho cộng đồng lập trình thi đấu.
site_author: OI Wiki Team
site_url: https://cuom1999.github.io/OI-wiki/
strict: false

# Repository
repo_name: 'cuom1999/OI-wiki'
repo_url: 'https://github.com/cuom1999/OI-wiki'
edit_uri: 'edit/vietnamese-translation/docs/'

